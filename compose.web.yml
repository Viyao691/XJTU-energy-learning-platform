name: energy-research-web

services:
  backend:
    image: ${ENERGY_API_IMAGE:-energy-research-api:web-20261015-mobile-v2}
    build:
      context: ./backend
      dockerfile: Dockerfile.web
    env_file: .env.web
    environment:
      ENERGY_WEB_MODE: "true"
      DATABASE_URL: sqlite:////data/energy_copilot.db
      PAPER_STORAGE_PATH: /data/papers
      BACKUP_PATH: /data/backups
      OMP_NUM_THREADS: "1"
    volumes:
      - energy_web_data:/data
    networks: [application, outbound]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    oom_score_adj: 500
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    image: ${ENERGY_WEB_IMAGE:-energy-research-web:web-20261015-mobile-v2}
    build:
      context: .
      dockerfile: frontend/Dockerfile.web
    environment:
      HOSTNAME: 0.0.0.0
      ENERGY_WEB_MODE: "true"
      BACKEND_API_URL: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=160
    networks:
      application:
      edge:
        aliases: [energy-web]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    oom_score_adj: 500
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/help]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  application:
    internal: true
  outbound:
  edge:
    external: true
    name: ${ENERGY_EDGE_NETWORK:-exam-king-beta_edge}

volumes:
  energy_web_data:
